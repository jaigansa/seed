[package]
name = "seed"
version = "0.2.0"
edition = "2024"
description = "A powerful project directory/file scaffolding and structure maintainer CLI"
authors = ["Jaiganesh <jaigansa@users.noreply.github.com>"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
serde_json = "1.0"
colored = "2.1"
dialoguer = "0.11"
walkdir = "2.5"
chrono = "0.4"
anyhow = "1.0"
regex = "1.10"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
tempfile = "3.27"

